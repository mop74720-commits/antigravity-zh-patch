name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        node-version: [20, 22]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Check license notices and run test suite
        run: |
          node -e "const fs = require('node:fs'); for (const f of ['LICENSE', 'THIRD_PARTY_NOTICES.md']) { if (!fs.existsSync(f)) throw new Error('Missing ' + f); }"
          npm test
